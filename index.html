<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五彩連珠</title>

    <!-- iOS / Android App 全螢幕與圖示設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="五彩連珠">
    <meta name="theme-color" content="#f4f5f7">
    
    <!-- App 桌面圖示 -->
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">

    <!-- PWA Manifest -->
    <script>
        const manifestData = {
            "name": "五彩連珠",
            "short_name": "五彩連珠",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#f4f5f7",
            "theme_color": "#f4f5f7",
            "icons": [
                {
                    "src": "./icon.svg",
                    "sizes": "512x512",
                    "type": "image/svg+xml",
                    "purpose": "any maskable"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifestData);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <style>
        :root {
            --bg-color: #f4f5f7;
            --board-bg: #e2e8f0;
            --cell-bg: #ffffff;
            --primary-blue: #1890ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 16px 12px;
            user-select: none;
            touch-action: manipulation;
        }

        /* 頂部資訊看板 */
        .dashboard {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: 400px;
            background: #ededed;
            padding: 14px 10px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .dash-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .dash-divider {
            width: 1px;
            height: 36px;
            background-color: #d0d0d0;
        }

        .dash-title {
            font-size: 16px;
            color: #666666;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .dash-value {
            font-size: 26px;
            color: #1890ff;
            font-weight: 800;
        }

        /* 下一波預覽彩球 */
        .next-preview {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
        }

        .preview-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        /* 棋盤區域 */
        #grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 4px;
            background-color: #e5e7eb;
            padding: 8px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
        }

        .cell {
            background-color: var(--cell-bg);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 平面化彩球 */
        .ball {
            width: 78%;
            height: 78%;
            border-radius: 50%;
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        /* 高對比顏色配置 */
        .color-purple { background-color: #c026d3; } /* 鮮豔紫羅蘭色 */
        .color-blue   { background-color: #06b6d4; } /* 亮天藍/水藍色 */
        .color-red    { background-color: #ef4444; } /* 鮮紅 */
        .color-green  { background-color: #22c55e; } /* 鮮綠 */
        .color-yellow { background-color: #eab308; } /* 亮黃 */

        /* 被點選時的樣式：白圈 + 珠子同色光暈 */
        .selected .ball.color-purple {
            outline: 2.5px solid #ffffff;
            box-shadow: 0 0 0 5px rgba(192, 38, 211, 0.45), 0 0 12px rgba(192, 38, 211, 0.8);
            transform: scale(1.05);
        }
        .selected .ball.color-blue {
            outline: 2.5px solid #ffffff;
            box-shadow: 0 0 0 5px rgba(6, 182, 212, 0.45), 0 0 12px rgba(6, 182, 212, 0.8);
            transform: scale(1.05);
        }
        .selected .ball.color-red {
            outline: 2.5px solid #ffffff;
            box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.45), 0 0 12px rgba(239, 68, 68, 0.8);
            transform: scale(1.05);
        }
        .selected .ball.color-green {
            outline: 2.5px solid #ffffff;
            box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.45), 0 0 12px rgba(34, 197, 94, 0.8);
            transform: scale(1.05);
        }
        .selected .ball.color-yellow {
            outline: 2.5px solid #ffffff;
            box-shadow: 0 0 0 5px rgba(234, 179, 8, 0.45), 0 0 12px rgba(234, 179, 8, 0.8);
            transform: scale(1.05);
        }

        /* 滿版大按鈕 */
        .action-btn {
            width: 100%;
            max-width: 400px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 0;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(24, 144, 255, 0.25);
        }

        .action-btn:active {
            opacity: 0.9;
            transform: translateY(1px);
        }

        /* 遊戲結束彈窗 */
        .game-over-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            font-size: 26px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- 頂部數據看板 -->
    <div class="dashboard">
        <div class="dash-item">
            <div class="dash-title">最佳紀錄</div>
            <div id="best-score" class="dash-value">0</div>
        </div>
        <div class="dash-divider"></div>
        <div class="dash-item">
            <div class="next-preview" id="next-balls"></div>
        </div>
        <div class="dash-divider"></div>
        <div class="dash-item">
            <div class="dash-title">分數</div>
            <div id="score" class="dash-value">0</div>
        </div>
    </div>

    <!-- 9x9 棋盤 -->
    <div id="grid"></div>

    <!-- 重新開始按鈕 -->
    <button class="action-btn" onclick="initGame()">
        🔄 重新開始
    </button>

    <!-- 遊戲結束視窗 -->
    <div id="game-over" class="game-over-modal">
        <div>遊戲結束！</div>
        <div style="margin-top: 10px; font-size: 22px;">得分：<span id="final-score" style="color: #60a5fa;">0</span></div>
        <div id="new-high-score-msg" style="margin-top: 5px; color: #facc15; font-size: 20px; display: none;">🎉 突破最高紀錄！</div>
        <button class="action-btn" style="width: auto; padding: 10px 28px; margin-top: 20px;" onclick="initGame()">再玩一次</button>
    </div>

    <script>
        const GRID_SIZE = 9;
        const COLORS = ['purple', 'blue', 'red', 'green', 'yellow'];
        const NEW_BALLS_COUNT = 3;
        
        let board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let selectedCell = null;
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('color_lines_best_score')) || 0;
        let nextColors = [];

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const nextBallsEl = document.getElementById('next-balls');
        const gameOverModal = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');
        const newHighScoreMsgEl = document.getElementById('new-high-score-msg');

        function initGame() {
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            score = 0;
            selectedCell = null;
            scoreEl.textContent = score;
            bestScoreEl.textContent = bestScore;
            gameOverModal.style.display = 'none';
            newHighScoreMsgEl.style.display = 'none';

            generateNextColors();
            renderBoard();

            spawnBalls(5);
            renderBoard();
        }

        function generateNextColors() {
            nextColors = [];
            for (let i = 0; i < NEW_BALLS_COUNT; i++) {
                nextColors.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
            }
            renderNextPreview();
        }

        function renderNextPreview() {
            nextBallsEl.innerHTML = '';
            nextColors.forEach(color => {
                const el = document.createElement('div');
                el.className = `preview-ball color-${color}`;
                nextBallsEl.appendChild(el);
            });
        }

        function renderBoard() {
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    if (board[r][c]) {
                        const ball = document.createElement('div');
                        ball.className = `ball color-${board[r][c]}`;
                        cell.appendChild(ball);
                    }

                    cell.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleCellClick(r, c);
                    });

                    gridEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (board[r][c]) {
                selectedCell = { r, c };
                renderBoard();
                return;
            }

            if (selectedCell) {
                if (hasPath(selectedCell.r, selectedCell.c, r, c)) {
                    board[r][c] = board[selectedCell.r][selectedCell.c];
                    board[selectedCell.r][selectedCell.c] = null;
                    selectedCell = null;

                    const cleared = checkAndClearLines();

                    if (!cleared) {
                        spawnBalls(NEW_BALLS_COUNT);
                        checkAndClearLines();
                    }

                    renderBoard();

                    if (isBoardFull()) {
                        finalScoreEl.textContent = score;
                        
                        if (score > bestScore) {
                            bestScore = score;
                            localStorage.setItem('color_lines_best_score', bestScore);
                            bestScoreEl.textContent = bestScore;
                            newHighScoreMsgEl.style.display = 'block';
                        }

                        gameOverModal.style.display = 'flex';
                    }
                }
            }
        }

        function hasPath(startR, startC, targetR, targetC) {
            const queue = [[startR, startC]];
            const visited = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
            visited[startR][startC] = true;

            const dirs = [[-1,0], [1,0], [0,-1], [0,1]];

            while (queue.length > 0) {
                const [cr, cc] = queue.shift();

                if (cr === targetR && cc === targetC) return true;

                for (let [dr, dc] of dirs) {
                    const nr = cr + dr;
                    const nc = cc + dc;

                    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                        if (!visited[nr][nc] && board[nr][nc] === null) {
                            visited[nr][nc] = true;
                            queue.push([nr, nc]);
                        }
                    }
                }
            }
            return false;
        }

        function spawnBalls(count) {
            const emptyCells = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === null) emptyCells.push({ r, c });
                }
            }

            if (emptyCells.length === 0) return;

            const spawnCount = Math.min(count, emptyCells.length);
            for (let i = 0; i < spawnCount; i++) {
                const randIndex = Math.floor(Math.random() * emptyCells.length);
                const { r, c } = emptyCells.splice(randIndex, 1)[0];
                board[r][c] = nextColors[i] || COLORS[Math.floor(Math.random() * COLORS.length)];
            }

            generateNextColors();
        }

        function checkAndClearLines() {
            const toClear = new Set();
            const directions = [[[0, 1]], [[1, 0]], [[1, 1]], [[1, -1]]];

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const color = board[r][c];
                    if (!color) continue;

                    directions.forEach(([dir]) => {
                        let line = [{ r, c }];
                        let dr = dir[0], dc = dir[1];

                        let nr = r + dr, nc = c + dc;
                        while (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc] === color) {
                            line.push({ r: nr, c: nc });
                            nr += dr;
                            nc += dc;
                        }

                        if (line.length >= 5) {
                            line.forEach(pos => toClear.add(`${pos.r},${pos.c}`));
                        }
                    });
                }
            }

            if (toClear.size > 0) {
                score += 10 + (toClear.size - 5) * 2;
                scoreEl.textContent = score;

                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('color_lines_best_score', bestScore);
                    bestScoreEl.textContent = bestScore;
                }

                toClear.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    board[r][c] = null;
                });
                return true;
            }

            return false;
        }

        function isBoardFull() {
            return board.every(row => row.every(cell => cell !== null));
        }

        initGame();

        // 離線 PWA 支援
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'color-lines-v5';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./', './index.html'])));
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }
    </script>
</body>
</html>
